name: Build Installer & Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Packages
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Windows için EXE Hazırla
      - name: Install Inno Setup
        run: choco install innosetup

      - name: Compile Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      # 2. Mac/Linux Scriptini Hazırla
      - name: Prepare Script
        run: |
          Copy-Item install_mac_linux.command -Destination dictionaries/

      # 3. ZIP Paketle (Sözlükler + Script)
      - name: Create Portable ZIP
        run: |
          Compress-Archive -Path dictionaries/* -DestinationPath Output/Aegisub-Turkish-Dictionary-Portable.zip

      # 4. Windows Yükleyicisini (EXE) Ayrı Yükle
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Aegisub-Turkish-Dictionary-Installer
          path: Output/*.exe

      # 5. Taşınabilir Paketi (ZIP) Ayrı Yükle
      - name: Upload Portable Package
        uses: actions/upload-artifact@v4
        with:
          name: Aegisub-Turkish-Dictionary-Portable
          path: Output/*.zip

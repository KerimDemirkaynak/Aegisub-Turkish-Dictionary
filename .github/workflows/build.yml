name: Build Installer & Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Packages
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Windows için EXE Hazırla
      - name: Install Inno Setup
        run: choco install innosetup

      - name: Compile Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      # 2. Mac/Linux Scriptini Hazırla
      # (install_mac_linux.command dosyasının repoda olduğundan emin olun)
      - name: Prepare Script
        run: |
          if (Test-Path install_mac_linux.command) {
              Copy-Item install_mac_linux.command -Destination dictionaries/
          } else {
              Write-Host "Uyarı: install_mac_linux.command bulunamadı, sadece sözlükler ziplenecek."
          }

      # 3. ZIP Paketle (Sözlükler + Varsa Script)
      - name: Create Portable ZIP
        run: |
          Compress-Archive -Path dictionaries/* -DestinationPath Output/Aegisub-Turkish-Dictionary-Portable.zip

      # 4. Windows Yükleyicisini (EXE) AYRI BİR İSİMLE YÜKLE
      # İndirirken "WINDOWS-KURULUM.zip" olarak inecek, içinden exe çıkacak.
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: 1-WINDOWS-KURULUM-EXE
          path: Output/*.exe

      # 5. Taşınabilir Paketi (ZIP) AYRI BİR İSİMLE YÜKLE
      # İndirirken "MAC-LINUX-PORTABLE.zip" olarak inecek.
      - name: Upload Portable Package
        uses: actions/upload-artifact@v4
        with:
          name: 2-MAC-LINUX-PORTABLE
          path: Output/*.zip

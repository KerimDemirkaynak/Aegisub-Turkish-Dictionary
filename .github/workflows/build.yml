name: Build Installer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Inno Setup Installer
    runs-on: windows-latest

    steps:
      # 1. Depodaki dosyaları çeker
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Inno Setup programını kurar (GitHub sunucusuna)
      - name: Install Inno Setup
        run: choco install innosetup

      # 3. .iss dosyasını derler ve EXE oluşturur
      - name: Compile Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      # 4. Oluşan EXE dosyasını GitHub'a yükler (İndirilebilir hale getirir)
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aegisub-Turkish-Dictionary-Installer
          path: Output/Aegisub-3.4.2-dict-tr_TR.exe

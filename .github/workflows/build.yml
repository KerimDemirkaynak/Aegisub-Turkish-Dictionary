name: Build Installer & Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # 1. Windows İşi (EXE Üretir)
  build-windows:
    name: Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Inno Setup
        run: choco install innosetup

      - name: Compile Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: 1-WINDOWS-KURULUM
          path: Output/*.exe

  # 2. Linux İşi (Mac/Linux Paketi Üretir)
  build-linux:
    name: Linux/Mac Portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Files
        run: |
          # Klasör oluştur
          mkdir Portable_Package
          
          # Sözlük dosyalarını kopyala
          cp dictionaries/tr_TR.aff Portable_Package/
          cp dictionaries/tr_TR.dic Portable_Package/
          
          # --- ÇİFT İSİMLENDİRME ADIMI ---
          # Aynı scripti hem Mac hem Linux ismiyle kopyalıyoruz
          cp install_mac_linux.command Portable_Package/install_mac.command
          cp install_mac_linux.command Portable_Package/install_linux.sh
          
          # İkisine de çalıştırma izni ver (+x)
          chmod +x Portable_Package/install_mac.command
          chmod +x Portable_Package/install_linux.sh

      - name: Upload Portable Package
        uses: actions/upload-artifact@v4
        with:
          name: 2-MAC-LINUX-PORTABLE
          path: Portable_Package/*

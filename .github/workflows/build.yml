name: Build Installer & Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Packages
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Windows için EXE Hazırla
      - name: Install Inno Setup
        run: choco install innosetup

      - name: Compile Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      # 2. Mac/Linux Scriptini Hazırla
      # Script dosyasını sözlüklerin yanına kopyalıyoruz.
      - name: Prepare Script
        run: |
          if (Test-Path install_mac_linux.command) {
              Copy-Item install_mac_linux.command -Destination dictionaries/
          }

      # --- BURADAKİ MANUEL ZIPLEME ADIMINI KALDIRDIK ---
      # Artık GitHub'ın kendi ziplemesini kullanacağız.

      # 3. Windows Yükleyicisini (EXE) Yükle
      # İndirince: 1-WINDOWS-KURULUM.zip -> İçinde direkt setup.exe çıkar.
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: 1-WINDOWS-KURULUM
          path: Output/*.exe

      # 4. Taşınabilir Paketi (Mac/Linux) Yükle
      # İndirince: 2-MAC-LINUX-PORTABLE.zip -> İçinde direkt aff, dic ve script dosyaları çıkar.
      - name: Upload Portable Package
        uses: actions/upload-artifact@v4
        with:
          name: 2-MAC-LINUX-PORTABLE
          path: dictionaries/*
